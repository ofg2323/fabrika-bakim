<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fabrika Bakım Yönetimi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2630">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fabrika Bakım">
<style>
:root{
  --bg:#eef0ee;
  --panel:#ffffff;
  --ink:#1e293b;
  --ink-soft:#475569; /* WCAG AA uyumlu 4.7:1 kontrast */
  --line:#cbd5e1;
  --accent:#d9720b;
  --accent-soft:#fef3c7;
  --danger:#b91c1c;
  --danger-soft:#fee2e2;
  --ok:#15803d;
  --ok-soft:#dcfce7;
  --warn:#92400e; /* Yüksek okunabilirlikli amber */
  --warn-soft:#fef3c7;
  --primary:#15803d; /* Endüstriyel aksiyon rengi: Zümrüt Yeşili */
  --primary-hover:#14532d;
  --sidebar:#1f2630;
  --sidebar-ink:#c7ccd4;
  --sidebar-active:#2b3542;
  --mono:"SF Mono","JetBrains Mono",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{min-height:100%; margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px;}
/* Klavye erişilebilirliği için focus göstergesi */
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
#root{min-height:100vh; width:100%; display:flex; flex-direction:column;}
#app{display:flex; min-height:100vh; width:100%; flex:1;}
.sidebar{width:210px; background:var(--sidebar); color:var(--sidebar-ink); flex-shrink:0; display:flex; flex-direction:column;}
.brand{padding:18px 16px 14px; border-bottom:1px solid #333e4a;}
.brand .b1{font-weight:800; font-size:15px; color:#fff; letter-spacing:-0.01em;}
.brand .b2{font-size:10.5px; color:#8993a2; margin-top:2px; letter-spacing:.03em; text-transform:uppercase;}
.brand .stripe{height:3px; margin-top:12px; background:repeating-linear-gradient(135deg,var(--accent) 0 8px,#1f2630 8px 16px); border-radius:2px;}
.navlinks{padding:10px 8px; flex:1; overflow-y:auto;}
.navlinks button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none;
  color:var(--sidebar-ink); padding:9px 10px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; margin-bottom:2px; font-family:var(--sans);
}
.navlinks button:hover{background:#28313d;}
.navlinks button.active{background:var(--sidebar-active); color:#fff;}
.navlinks .ic{width:16px; text-align:center; opacity:.85;}
.userbox{padding:12px 14px; border-top:1px solid #333e4a;}
.userbox .name{color:#fff; font-weight:700; font-size:12.5px;}
.userbox .role{font-size:11px; color:#8993a2;}
.userbox button{margin-top:8px; width:100%; background:#28313d; color:var(--sidebar-ink); border:none; border-radius:6px; padding:6px; font-size:11.5px; cursor:pointer;}
.userbox button:hover{background:#333e4a;}
.main{flex:1; min-width:0; padding:24px 28px 60px; width:100%;}
.topbar{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.topbar h1{font-size:19px; margin:0; font-weight:800; letter-spacing:-0.01em;}
.topbar .sub{color:var(--ink-soft); font-size:12.5px; margin-top:2px;}
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px;}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; border-left:3px solid var(--line);}
.kpi.k-accent{border-left-color:var(--accent);}
.kpi.k-danger{border-left-color:var(--danger);}
.kpi.k-warn{border-left-color:var(--warn);}
.kpi.k-ok{border-left-color:var(--ok);}
.kpi.k-muted{border-left-color:var(--ink-soft);}
.kpi .n{font-family:var(--mono); font-size:24px; font-weight:700;}
.kpi .l{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:18px;}
.panel h2{font-size:14px; margin:0 0 12px; font-weight:800;}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.spacer{flex:1;}
button.primary{background:var(--primary); color:#fff; border:none; border-radius:7px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,0.08); transition:background-color .15s ease, transform .05s;}
button.primary:hover{background:var(--primary-hover);}
button.primary:active{transform:translateY(1px);}
button.accent{background:var(--accent); color:#fff; border:none; border-radius:7px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;}
button.accent:hover{background:#c05f00;}
button.ghost{background:none; border:1px solid var(--line); border-radius:6px; padding:7px 12px; font-size:12.5px; cursor:pointer; color:var(--ink-soft);}
button.ghost:hover{color:var(--ink); border-color:#94a3b8;}
button.small{padding:5px 10px; font-size:12px; border-radius:5px;}
button.icon{background:none; border:none; cursor:pointer; font-size:14px; color:var(--ink-soft); padding:3px 6px; border-radius:4px;}
button.icon:hover{color:var(--danger); background:#fee2e2;}
/* Toast Bildirimleri */
#toastContainer{position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px; pointer-events:none;}
.toast{pointer-events:auto; display:flex; align-items:center; gap:10px; min-width:280px; max-width:420px; padding:12px 16px; border-radius:8px; background:#1e293b; color:#fff; font-size:13px; font-weight:600; box-shadow:0 10px 25px -5px rgba(0,0,0,0.25); transform:translateY(20px); opacity:0; transition:all .25s cubic-bezier(.16,1,.3,1);}
.toast.show{transform:translateY(0); opacity:1;}
.toast.t-success{border-left:4px solid var(--ok);}
.toast.t-error{border-left:4px solid var(--danger); background:#2f1515;}
.toast.t-info{border-left:4px solid var(--accent);}
.toast .t-icon{font-size:16px; flex-shrink:0;}
.toast .t-msg{flex:1; line-height:1.4;}
.toast .t-close{background:none; border:none; color:#94a3b8; font-size:15px; cursor:pointer; padding:2px 6px;}
.toast .t-close:hover{color:#fff;}
select,input,textarea{border:1px solid var(--line); border-radius:6px; padding:7px 9px; font-size:13px; font-family:var(--sans); color:var(--ink); background:#fff;}
input[type=file]{border:1px dashed var(--line); background:#fafbfa; font-size:12px; padding:6px;}
textarea{width:100%; resize:vertical; min-height:50px;}
label.f-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:700; display:block; margin-bottom:4px;}
.field{display:flex; flex-direction:column; gap:4px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
table{width:100%; border-collapse:collapse;}
thead th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--line); background:#fafbfa;}
tbody td{padding:9px 10px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fafbfa;}
.mono{font-family:var(--mono); font-size:12px;}
.muted{color:var(--ink-soft);}
.tiny{font-size:11px;}
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap;}
.b-accent{background:var(--accent-soft); color:var(--accent);}
.b-danger{background:var(--danger-soft); color:var(--danger);}
.b-ok{background:var(--ok-soft); color:var(--ok);}
.b-warn{background:var(--warn-soft); color:var(--warn);}
.b-muted{background:#eef0ee; color:var(--ink-soft);}
.dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
.tabs{display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--line);}
.tabs button{background:none; border:none; padding:8px 12px; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent;}
.tabs button.active{color:var(--accent); border-bottom-color:var(--accent);}
.empty{text-align:center; padding:40px 20px; color:var(--ink-soft); border:1px dashed var(--line); border-radius:10px; font-size:13px;}
.overlay{position:fixed; inset:0; background:rgba(20,24,30,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
.overlay.open{display:flex;}
.modal{background:#fff; border-radius:12px; padding:20px 22px; width:100%; max-width:620px; max-height:88vh; overflow:auto;}
.modal h3{margin:0 0 14px; font-size:15px; font-weight:800;}
.modal .actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}
.checklist-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.checklist-row select{width:130px;}
.checklist-row .qtext{flex:1; font-size:12.5px;}
.mat-row{display:grid; grid-template-columns:1fr 90px 30px; gap:8px; margin-bottom:6px; align-items:center;}
.login-wrap{min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; background:var(--sidebar);}
.login-card{background:#fff; border-radius:14px; padding:30px 32px; width:100%; max-width:380px;}
.login-card .stripe{height:4px; background:repeating-linear-gradient(135deg,var(--accent) 0 8px,#eee 8px 16px); border-radius:2px; margin-bottom:18px;}
.login-card h2{margin:0 0 4px; font-size:18px; font-weight:800;}
.login-card p{color:var(--ink-soft); font-size:12.5px; margin:0 0 18px;}
.userpick{display:flex; flex-direction:column; gap:8px;}
.userpick button{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fafbfa; cursor:pointer; font-family:var(--sans); font-size:13px; font-weight:700; color:var(--ink);}
.userpick button:hover{border-color:var(--accent);}
.userpick .r{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:12px; background:var(--accent-soft); color:var(--accent);}
.weeknav{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.weeknav .lbl{font-weight:700; font-size:13px; font-family:var(--mono);}
.lowstock{color:var(--danger); font-weight:700;}
.att-item{display:flex; gap:8px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px;}
.combo{position:relative;}
.combo-list{position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:6px; max-height:190px; overflow-y:auto; z-index:80; display:none; box-shadow:0 6px 18px rgba(0,0,0,.12); margin-top:3px;}
.combo-opt{padding:7px 10px; font-size:12.5px; cursor:pointer;}
.combo-opt:hover{background:var(--accent-soft);}
.combo-sub{color:var(--ink-soft); font-size:11px; margin-left:6px;}
.combo-empty{color:var(--ink-soft); cursor:default;}
.combo-empty:hover{background:none;}
.filterbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px;}
.filterbar input[type=text]{min-width:220px; flex:1;}
.panel{overflow-x:auto;}
@media(max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr);}
  .grid2,.grid3{grid-template-columns:1fr;}
  button.small{padding:7px 12px; font-size:12.5px; min-height:36px;}
  button.ghost{min-height:38px;}
  tbody td{padding:12px 10px;}
  .actions button{min-height:40px; padding:9px 18px;}
}
@media(max-width:780px){
  #app{flex-direction:column;}
  .sidebar{
    position:fixed; bottom:0; left:0; right:0; top:auto; width:100%; height:auto;
    flex-direction:row; z-index:40; border-top:1px solid #333e4a;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sidebar .brand{display:none;}
  .sidebar .navlinks{display:flex; flex-direction:row; overflow-x:auto; padding:6px 4px; flex:1; gap:2px; -webkit-overflow-scrolling:touch;}
  .sidebar .navlinks button{flex-direction:column; white-space:nowrap; padding:6px 10px 4px; font-size:10px; margin-bottom:0; gap:3px; min-width:62px; text-align:center; border-radius:8px;}
  .sidebar .navlinks .ic{font-size:17px;}
  .sidebar .userbox{display:none;}
  .main{padding:14px 14px 90px;}
  .mobile-userbar{display:flex; justify-content:space-between; align-items:center; padding:0 0 12px; margin-bottom:14px; border-bottom:1px solid var(--line); font-size:12px; color:var(--ink-soft);}
  .mobile-userbar b{color:var(--ink);}
  .mobile-userbar button{background:none; border:1px solid var(--line); border-radius:6px; padding:5px 10px; font-size:11px; color:var(--ink-soft);}
}

/* Print / form output */
#printArea{display:none; color:#000; background:#fff;}
.print-header{text-align:center; margin-bottom:16px; border-bottom:2px solid #000; padding-bottom:10px;}
.print-logo{max-height:64px; max-width:220px; margin-bottom:8px;}
.print-company{font-weight:800; font-size:16px;}
.print-title{font-size:13px; margin-top:2px; text-transform:uppercase; letter-spacing:.05em;}
.print-table{width:100%; border-collapse:collapse; margin-bottom:14px; font-size:12px;}
.print-table th, .print-table td{border:1px solid #333; padding:5px 8px; text-align:left;}
.print-table th{background:#eee; font-weight:700; width:120px;}
.print-section-title{font-weight:800; font-size:12.5px; margin:14px 0 6px; text-transform:uppercase; letter-spacing:.03em;}
.print-note{border:1px solid #333; padding:8px; font-size:12px; min-height:40px; white-space:pre-wrap;}
.print-signatures{display:flex; gap:30px; margin-top:40px;}
.print-sig-box{flex:1; text-align:center; font-size:11px;}
.print-sig-line{border-top:1px solid #000; margin-bottom:6px; height:40px;}
.print-footer{margin-top:20px; font-size:10px; color:#555; text-align:center; border-top:1px solid #ccc; padding-top:6px;}
@media print{
  #app{display:none !important;}
  .overlay{display:none !important;}
  #printArea{display:block !important;}
}
</style>

<body>
<div id="root"></div>
<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>

<script>
const DB_KEY = 'cmms-db';
window.db = {
  users: [],
  assetGroups: [],
  assets: [],
  materials: [],
  maintenanceRecords: [],
  faults: [],
  inspectionRecords: [],
  extMaintRecords: [],
  purchases: [],
  needsList: [],
  stockMovements: [],
  suppliers: [],
  projects: [],
  counters: { fault: 0, maint: 0, inspection: 0, extmaint: 0, project: 0 },
  printTemplate: {}
};
let db = window.db;
let currentTab = 'panel';
let weekOffset = 0;
let maintFilter = 'upcoming';
let faultFilter = 'open';
let stockTab = 'materials';
let tempChecklist = [], tempChecklistResults = [], tempUsedMaterials = [], tempOriginalUsed = [], tempSpareParts = [];
let _confirmCb = null;
let assetQuery='', assetFGroup='', assetFStatus='';
let faultQuery='', faultFPriority='', faultFAssignee='';
let maintQuery='', maintFGroup='', maintHistQuery='', maintFType='';
let inspectionFilter='upcoming', inspectionQuery='', inspectionFGroup='', inspectionHistQuery='';
let extMaintFilter='upcoming', extMaintFGroup='', extMaintHistQuery='';
let tempExtMaintAssetIds = [];
let tempCertificates = [], certsToDelete = [];
let stockMatQuery='', stockMatFStatus='';
let needsQuery='', needsFStatus='';
let purchQuery='';
let supplierQuery='';
let costStartDate='', costEndDate='', costFType='';
let currentProjectId = null, projectDetailTab = 'genel', projectQuery='', projectFStatus='';
let movQuery='', movFType='';
let comboData = {}, comboOnChangeMap = {};
function comboHtml(id, placeholder){
  return `<div class="combo">
    <input type="text" class="combo-input" id="${id}-q" placeholder="${esc(placeholder||'Ara ve seç...')}" autocomplete="off"
      oninput="comboFilter('${id}')" onfocus="comboOpen('${id}')" onblur="setTimeout(function(){comboClose('${id}')},150)">
    <input type="hidden" id="${id}">
    <div class="combo-list" id="${id}-list"></div>
  </div>`;
}
function comboInit(id, options, value, onChange){
  comboData[id] = options;
  if(onChange) comboOnChangeMap[id]=onChange;
  const sel = options.find(o=>String(o.value)===String(value));
  const hidden = document.getElementById(id);
  const q = document.getElementById(id+'-q');
  if(hidden) hidden.value = value!=null?value:'';
  if(q) q.value = sel?sel.label:'';
}
window.comboOpen = function(id){
  const qEl = document.getElementById(id+'-q');
  if(qEl) qEl.value = '';
  comboFilter(id);
};
window.comboFilter = function(id){
  const qEl = document.getElementById(id+'-q');
  const listEl = document.getElementById(id+'-list');
  if(!qEl || !listEl) return;
  const q = qEl.value.toLowerCase();
  const opts = (comboData[id]||[]).filter(o=> !q || o.label.toLowerCase().includes(q));
  listEl.innerHTML = opts.slice(0,60).map(o=>`<div class="combo-opt" onmousedown="comboPick('${id}','${String(o.value).replace(/'/g,"\\'")}')">${esc(o.label)}${o.sub?`<span class="combo-sub">${esc(o.sub)}</span>`:''}</div>`).join('') || `<div class="combo-opt combo-empty">Sonuç yok</div>`;
  listEl.style.display='block';
};
window.comboPick = function(id, value){
  const opt = (comboData[id]||[]).find(o=>String(o.value)===String(value));
  const hidden = document.getElementById(id);
  const q = document.getElementById(id+'-q');
  if(hidden) hidden.value = value;
  if(q) q.value = opt?opt.label:'';
  comboClose(id);
  const cb = comboOnChangeMap[id];
  if(cb) cb(value);
};
window.comboClose = function(id){
  const l=document.getElementById(id+'-list'); if(l) l.style.display='none';
  const hidden = document.getElementById(id);
  const q = document.getElementById(id+'-q');
  if(hidden && q){
    const opt = (comboData[id]||[]).find(o=>String(o.value)===String(hidden.value));
    q.value = opt ? opt.label : '';
  }
};

const ROLES = ['Yönetici','Teknisyen','Depo Sorumlusu'];
const MAINT_TYPES = ['Periyodik','Arıza Sonrası','Kestirimci','Genel/Diğer'];
const DEFAULT_PRINT_TEMPLATE = {
  companyName:'Fabrika Adı',
  logoKey:null,
  footerNote:'',
  pageSize:'A4',
  orientation:'portrait',
  maint:{
    showAssetInfo:true,
    showTypeAndDates:true,
    showChecklist:true,
    showMaterials:true,
    showNotes:true,
    showSignatures:true,
    signatureLabels:['Bakımı Yapan','Kontrol Eden'],
  },
  fault:{
    showAssetInfo:true,
    showPriorityStatus:true,
    showDescription:true,
    showMaterials:true,
    showNotes:true,
    showSignatures:true,
    signatureLabels:['Bildiren','Kontrol Eden'],
  },
};
function migratePrintTemplate(t){
  if(!t) return JSON.parse(JSON.stringify(DEFAULT_PRINT_TEMPLATE));
  if(t.maint && t.fault) return t;
  return {
    companyName: t.companyName||'Fabrika Adı',
    logoKey: t.logoKey||null,
    footerNote: t.footerNote||'',
    pageSize: t.pageSize||'A4',
    orientation: t.orientation||'portrait',
    maint:{
      showAssetInfo: t.showAssetInfo!==undefined?t.showAssetInfo:true,
      showTypeAndDates: t.showTypeAndDates!==undefined?t.showTypeAndDates:true,
      showChecklist: t.showChecklist!==undefined?t.showChecklist:true,
      showMaterials: t.showMaterials!==undefined?t.showMaterials:true,
      showNotes: t.showNotes!==undefined?t.showNotes:true,
      showSignatures: t.showSignatures!==undefined?t.showSignatures:true,
      signatureLabels: t.signatureLabels||['Bakımı Yapan','Kontrol Eden'],
    },
    fault: JSON.parse(JSON.stringify(DEFAULT_PRINT_TEMPLATE.fault)),
  };
}
const uid = p => (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayStr = () => new Date().toISOString().slice(0,10);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function seedDB(){
  const u1=uid('u'), u2=uid('u'), u3=uid('u');
  const g1=uid('g'), g2=uid('g'), g3=uid('g');
  const a1=uid('a'), a2=uid('a'), a3=uid('a'), a4=uid('a');
  const m1=uid('m'), m2=uid('m'), m3=uid('m'), m4=uid('m');
  const daysAgo = n => { const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
  return {
    users:[
      {id:u1, name:'Ahmet Yılmaz', role:'Yönetici', passwordHash:null},
      {id:u2, name:'Mehmet Demir', role:'Teknisyen', passwordHash:null},
      {id:u3, name:'Ayşe Kaya', role:'Depo Sorumlusu', passwordHash:null},
    ],
    assetGroups:[
      {id:g1, name:'Hidrolik Pompalar', periodDays:90, checklist:[

async function loadDB(){
  try{
    const res = await window.storage.get(DB_KEY, true);
    db = res ? JSON.parse(res.value) : seedDB();
    if(!res) await saveDB();
  }catch(e){
    db = seedDB();
    try{ await saveDB(); }catch(e2){}
  }
  // Bu blok try/catch dışında: ilk yükleme başarısız olup seedDB'ye
  // düşülse bile veya eski/eksik şekilli bir kayıt yüklense bile,
  // aşağıdaki alanların her zaman var olması garanti edilir.
  if(!db || typeof db!=='object') db = seedDB();
  db.users = db.users || [];
  db.assetGroups = db.assetGroups || [];
  db.assets = db.assets || [];
  db.materials = db.materials || [];
  db.maintenanceRecords = db.maintenanceRecords || [];
  db.faults = db.faults || [];
  db.purchases = db.purchases || [];
  db.needsList = db.needsList || [];
  db.stockMovements = db.stockMovements || [];
  db.inspectionRecords = db.inspectionRecords || [];
  db.inspectionRecords.forEach(r=>{
    if(!r.assetIds){
      const a = r.assetId ? db.assets.find(x=>x.id===r.assetId) : null;
      r.assetIds = r.assetId ? [r.assetId] : [];
      r.groupId = r.groupId || (a?a.groupId:null);
      delete r.assetId;
    }
  });
  db.extMaintRecords = db.extMaintRecords || [];
  db.suppliers = db.suppliers || [];
  db.projects = db.projects || [];
  db.printTemplate = migratePrintTemplate(db.printTemplate);
  db.counters = db.counters || {fault:0, maint:0, inspection:0, extmaint:0, project:0};
  db.counters.fault = db.counters.fault || 0;
  db.counters.maint = db.counters.maint || 0;
  db.counters.inspection = db.counters.inspection || 0;
  db.counters.extmaint = db.counters.extmaint || 0;
  db.counters.project = db.counters.project || 0;
  db.assetGroups.forEach(g=>{
    if(g.inspectionEnabled===undefined) g.inspectionEnabled=false;
    if(g.inspectionPeriodDays===undefined) g.inspectionPeriodDays=null;
    if(g.inspectionBaselineDate===undefined) g.inspectionBaselineDate=null;
    if(g.extMaintEnabled===undefined) g.extMaintEnabled=false;
    if(g.extMaintPeriodDays===undefined) g.extMaintPeriodDays=null;
    if(g.extMaintBaselineDate===undefined) g.extMaintBaselineDate=null;
    g.checklist = g.checklist || [];
  });
  db.assets.forEach(a=>{
    a.spareParts = a.spareParts || [];
    a.attachments = a.attachments || [];
  });
  db.faults.forEach(f=>{ f.usedMaterials = f.usedMaterials || []; f.attachments = f.attachments || []; });
  db.maintenanceRecords.forEach(r=>{ r.usedMaterials = r.usedMaterials || []; r.checklistResults = r.checklistResults || []; });
  db.projects.forEach(pr=>{
    pr.tasks = pr.tasks || [];
    pr.quotes = pr.quotes || [];
    pr.progressLogs = pr.progressLogs || [];
    pr.budgetHistory = pr.budgetHistory || [];
    pr.budgetAmount = pr.budgetAmount || 0;
  });
  // Değiştirilmiş/onarılmış veriyi kalıcı hale getir
  try{ await saveDB(); }catch(e3){}
}

function nextDueDate(as){
  const g = group(as.groupId);
  if(!g) return null;
  const raw = as.lastMaintenanceDate || as.createdDate || todayStr();
  const base = String(raw).slice(0, 10);
  const d = new Date(base+'T00:00:00');
  if (isNaN(d.getTime())) return null;
  d.setDate(d.getDate() + Number(g.periodDays || 0));
  return isNaN(d.getTime()) ? null : d.toISOString().slice(0,10);
}
function nextInspectionDue(as){
  const g = group(as.groupId);
  if(!g || !g.inspectionEnabled || !g.inspectionPeriodDays) return null;
  const raw = as.lastInspectionDate || g.inspectionBaselineDate || as.createdDate || todayStr();
  const base = String(raw).slice(0, 10);
  const d = new Date(base+'T00:00:00');
  if (isNaN(d.getTime())) return null;
  d.setDate(d.getDate() + Number(g.inspectionPeriodDays || 0));
  return isNaN(d.getTime()) ? null : d.toISOString().slice(0,10);
}
function nextExtMaintDue(as){
  const g = group(as.groupId);
  if(!g || !g.extMaintEnabled || !g.extMaintPeriodDays) return null;
  const raw = as.lastExtMaintDate || g.extMaintBaselineDate || as.createdDate || todayStr();
  const base = String(raw).slice(0, 10);
  const d = new Date(base+'T00:00:00');
  if (isNaN(d.getTime())) return null;
  d.setDate(d.getDate() + Number(g.extMaintPeriodDays || 0));
  return isNaN(d.getTime()) ? null : d.toISOString().slice(0,10);
}
function daysDiff(dateStr){
  if(!dateStr) return 0;
  const base = String(dateStr).slice(0, 10);
  const d = new Date(base+'T00:00:00');
  if (isNaN(d.getTime())) return 0;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function startOfWeek(offset){
  const d = new Date(); d.setHours(0,0,0,0);
  const day = (d.getDay()+6)%7;
  d.setDate(d.getDate()-day+offset*7);
  return d;
}
function fmt(d){ return (d && !isNaN(d.getTime())) ? d.toLocaleDateString('tr-TR',{day:'2-digit', month:'2-digit'}) : '—'; }
function fmtStr(s){
  if(!s) return '—';
  const base = String(s).slice(0, 10);
  const d = new Date(base+'T00:00:00');
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'});
}

function computeGroupInspectionSummary(windowDays){
  return db.assetGroups.filter(g=>g.inspectionEnabled).map(g=>{
    const assets = db.assets.filter(a=>a.groupId===g.id);
    const withDue = assets.map(a=>({a, due: nextInspectionDue(a)})).filter(x=>x.due);
    const dueSoon = withDue.filter(x=> daysDiff(x.due) <= windowDays).sort((p,q)=>p.due.localeCompare(q.due));
    return {group:g, assets, withDue, dueSoon};
  }).filter(x=>x.dueSoon.length>0);
}
function computeGroupExtMaintSummary(windowDays){
  return db.assetGroups.filter(g=>g.extMaintEnabled).map(g=>{
    const assets = db.assets.filter(a=>a.groupId===g.id);
    const withDue = assets.map(a=>({a, due: nextExtMaintDue(a)})).filter(x=>x.due);
    const dueSoon = withDue.filter(x=> daysDiff(x.due) <= windowDays).sort((p,q)=>p.due.localeCompare(q.due));
    return {group:g, assets, withDue, dueSoon};
  }).filter(x=>x.dueSoon.length>0);
}
function applyMaterialDelta(oldUsed, newUsed){
  (oldUsed||[]).forEach(u=>{ const m=material(u.materialId); if(m) m.qty = +(m.qty+u.qty).toFixed(2); });
  (newUsed||[]).forEach(u=>{ const m=material(u.materialId); if(m) m.qty = Math.max(0, +(m.qty-u.qty).toFixed(2)); });
}
function materialsCost(usedMaterials){
  return (usedMaterials||[]).reduce((sum,u)=> sum + (u.qty * (u.unitCost||0)), 0);
}
function maintRecordCost(r){ return materialsCost(r.usedMaterials) + (r.extraCost||0); }
function faultCost(f){ return materialsCost(f.usedMaterials) + (f.externalServiceCost||0); }
function fmtMoney(n){ return (n||0).toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2})+' ₺'; }
function logStockMovement(materialId, mtype, qty, reason, refId){
  if(qty<=0) return;
  db.stockMovements.push({id:uid('sm'), materialId, type:mtype, qty:+qty.toFixed(2), date:todayStr(), userId:currentUser.id, reason:reason||'', refPurchaseId:refId||null});
}
function addStockMovement(materialId, mtype, qty, reason, refPurchaseId){
  const m = material(materialId); if(!m) return;
  if(mtype==='Giriş') m.qty = +(m.qty+qty).toFixed(2);
  else m.qty = Math.max(0, +(m.qty-qty).toFixed(2));
  logStockMovement(materialId, mtype, qty, reason, refPurchaseId);
}
function logMaterialUsageDelta(oldUsed, newUsed, label, refId){
  const map = {};
  (oldUsed||[]).forEach(u=>{ map[u.materialId] = (map[u.materialId]||0) - u.qty; });
  (newUsed||[]).forEach(u=>{ map[u.materialId] = (map[u.materialId]||0) + u.qty; });
  Object.keys(map).forEach(mid=>{
    const delta = map[mid];
    if(Math.abs(delta) < 1e-9) return;
    if(delta>0) logStockMovement(mid, 'Çıkış', delta, label, refId);
    else logStockMovement(mid, 'Giriş', -delta, label+' (iade)', refId);
  });
}
function orderedAssetsTree(){
  const byParent = {};
  db.assets.forEach(a=>{ const k=(a.parentId && asset(a.parentId)) ? a.parentId : '__root__'; (byParent[k]=byParent[k]||[]).push(a); });
  const result=[];
  function walk(parentKey, depth, guard){
    if(guard>15) return;
    (byParent[parentKey]||[]).sort((x,y)=>x.name.localeCompare(y.name)).forEach(a=>{ result.push({a, depth}); walk(a.id, depth+1, guard+1); });
  }
  walk('__root__',0,0);
  const seen = new Set(result.map(r=>r.a.id));
  db.assets.forEach(a=>{ if(!seen.has(a.id)) result.push({a, depth:0}); });
  return result;
}
function exportCSV(filename, headers, rows){
  const escCsv = v => { const s=(v==null?'':String(v)); return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [headers.map(escCsv).join(';'), ...rows.map(r=>r.map(escCsv).join(';'))];
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href=url; link.download=filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
}
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===';'){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=> r.some(c=>c && c.trim()!==''));
}

  const ft = t.fault || DEFAULT_PRINT_TEMPLATE.fault;
  const logoUrl = await fetchLogoDataUrl();
  let html = `<div class="print-header">
    ${logoUrl?`<img class="print-logo" src="${logoUrl}">`:''}
    <div class="print-company">${esc(t.companyName||'')}</div>
    <div class="print-title">Arıza Formu${f.trackingNo?' — '+esc(f.trackingNo):''}</div>
  </div>`;
  if(ft.showAssetInfo){
    html += `<table class="print-table">
      <tr><th>Takip No</th><td>${esc(f.trackingNo||'')}</td><th>Varlık</th><td>${esc(a?a.name:'')}</td></tr>
      <tr><th>Varlık Kodu</th><td>${esc((a&&a.assetCode)||'')}</td><th>Konum</th><td>${esc((a&&a.location)||'')}</td></tr>
      <tr><th>Grup</th><td>${esc(g?g.name:'')}</td><th>Atanan</th><td>${esc(userName(f.assignedTo))}</td></tr>
    </table>`;
  }
  if(ft.showPriorityStatus){
    html += `<table class="print-table">
      <tr><th>Öncelik</th><td>${esc(f.priority)}</td><th>Durum</th><td>${esc(f.status)}</td></tr>
      <tr><th>Bildirim Tarihi</th><td>${fmtStr(f.reportedDate)}</td><th>Kapanış Tarihi</th><td>${f.resolvedDate?fmtStr(f.resolvedDate):'—'}</td></tr>
    </table>`;
  }
  if(ft.showDescription){
    html += `<div class="print-section-title">Başlık / Açıklama</div><div class="print-note">${esc(f.title)}${f.description?('\n\n'+f.description):''}</div>`;
  }
  if(ft.showMaterials && f.usedMaterials && f.usedMaterials.length){
    html += `<div class="print-section-title">Kullanılan Malzemeler</div>
      <table class="print-table"><thead><tr><th style="width:auto;">Malzeme</th><th>Miktar</th><th>Tutar</th></tr></thead><tbody>
      ${f.usedMaterials.map(u=>{ const m=material(u.materialId); return `<tr><td>${esc(m?m.name:'')}</td><td>${u.qty} ${m?esc(m.unit):''}</td><td>${fmtMoney(u.qty*(u.unitCost||0))}</td></tr>`; }).join('')}
      </tbody></table>`;
  }
  const totalFCost = faultCost(f);
  if(totalFCost>0){
    html += `<table class="print-table">
      <tr><th>Malzeme Maliyeti</th><td>${fmtMoney(materialsCost(f.usedMaterials))}</td><th>Dış Servis Ücreti</th><td>${fmtMoney(f.externalServiceCost)}</td></tr>
      <tr><th>Toplam Maliyet</th><td colspan="3" style="font-weight:800;">${fmtMoney(totalFCost)}</td></tr>
    </table>`;
  }
  if(ft.showNotes){ html += `<div class="print-section-title">Çözüm Notu</div><div class="print-note"${f.notes?'':' style="min-height:230px;"'}>${esc(f.notes||'')}</div>`; }
  if(ft.showSignatures && (ft.signatureLabels||[]).length){
    html += `<div class="print-signatures">${ft.signatureLabels.map(l=>`<div class="print-sig-box"><div class="print-sig-line"></div><div>${esc(l)}</div></div>`).join('')}</div>`;
  }
  if(t.footerNote){ html += `<div class="print-footer">${esc(t.footerNote)}</div>`; }
  openPrintWindow(html, `@page{ size:${t.pageSize||'A4'} ${t.orientation||'portrait'}; margin:16mm; }`);
}

// ---------- boot / auth ----------
async function boot(){
  document.getElementById('root').innerHTML = '<div class="login-wrap"><div class="login-card"><div class="stripe"></div><p>Yükleniyor...</p></div></div>';

function render(){ if(!currentUser){ renderLogin(); } else { renderApp(); } }

function renderLogin(){
  const root = document.getElementById('root');
  const hasUsers = db.users.length>0;
  root.innerHTML = `<div class="login-wrap"><div class="login-card">
    <div class="stripe"></div>
    <h2>Fabrika Bakım Yönetimi</h2>

      <div style="margin-top:14px;"><button class="ghost" onclick="showAddFirstUser()">+ Yeni kullanıcı ekle</button></div>`

}
window.promptPassword = function(id){
  const u = user(id);
  const root = document.getElementById('root');
  root.querySelector('.login-card').innerHTML = `<div class="stripe"></div>
    <h2>${esc(u.name)}</h2><p>Şifrenizi girin</p>
    <div class="field"><input id="login-pw" type="password" placeholder="Şifre" style="width:100%;"></div>
    <div id="login-err" class="tiny" style="color:var(--danger); margin-top:6px;"></div>
    <div style="margin-top:14px; display:flex; gap:8px;">
      <button class="primary" onclick="attemptLogin('${id}')">Giriş Yap</button>
      <button class="ghost" onclick="render()">Geri</button>
    </div>`;
  const pwEl = document.getElementById('login-pw');
  pwEl.focus();
  pwEl.addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(id); });
};
window.attemptLogin = async function(id){
  const pw = document.getElementById('login-pw').value;
  const u = user(id);
  const hash = await hashPassword(pw);
  if(hash===u.passwordHash){ currentUser=u; await saveSession(id); currentTab='panel'; render(); }
  else { document.getElementById('login-err').textContent = 'Hatalı şifre.'; }
};
window.loginAs = async function(id){ currentUser=user(id); await saveSession(id); currentTab='panel'; render(); };
window.createFirstUser = async function(){
  const name = document.getElementById('fu-name').value.trim();
  const pw = document.getElementById('fu-pw').value;
  if(!name || !pw){ alert('Ad soyad ve şifre gereklidir.'); return; }
  const u = {id:uid('u'), name, role:'Yönetici', passwordHash: await hashPassword(pw)};
  db.users.push(u); await saveDB(); await loginAs(u.id);
};
window.showAddFirstUser = function(){
  const root = document.getElementById('root');
  root.querySelector('.login-card').innerHTML = `<div class="stripe"></div>

window.addUserFromLogin = async function(){
  const name = document.getElementById('nu-name').value.trim();
  const r = document.getElementById('nu-role').value;
  const pw = document.getElementById('nu-pw').value;
  if(!name || !pw){ alert('Ad soyad ve şifre gereklidir.'); return; }

function tabsForRole(){
  const r = role();
  const all = [
    ['panel','📋','Panel'], ['assets','🏷️','Varlıklar'], ['groups','🗂️','Varlık Grupları'],
    ['maint','🛠️','Bakımlar'], ['extmaint','🧰','Dış Bakım'], ['inspection','🔍','Muayene'], ['faults','⚠️','Arızalar'], ['stock','📦','Stok'],
    ['projects','📁','Projeler'],
    ['costs','💰','Maliyet Raporu'],
    ['settings','⚙️','Ayarlar'],
  ];
  if(r==='Yönetici') return all;
  if(r==='Teknisyen') return all.filter(t=>['panel','assets','maint','extmaint','inspection','faults','stock','projects'].includes(t[0]));
  if(r==='Depo Sorumlusu') return all.filter(t=>['panel','stock','maint','extmaint','inspection','faults','assets'].includes(t[0]));
  return all;
}
function renderApp(){
  const root = document.getElementById('root');
  const tabs = tabsForRole();
  if(!tabs.find(t=>t[0]===currentTab)) currentTab = 'panel';
  root.innerHTML = `<div id="app">
    <div class="sidebar">
      <div class="brand"><div class="b1">Fabrika Bakım</div><div class="b2">Varlık &amp; Bakım Takip</div><div class="stripe"></div></div>

window.logout = async function(){ currentUser=null; await saveSession(null); render(); };

function renderTab(){
  const el = document.getElementById('mainContent');
  if(currentTab==='panel') return renderPanel(el);
  if(currentTab==='assets') return renderAssets(el);
  if(currentTab==='groups') return renderGroups(el);
  if(currentTab==='maint') return renderMaint(el);
  if(currentTab==='extmaint') return renderExtMaint(el);
  if(currentTab==='inspection') return renderInspection(el);
  if(currentTab==='faults') return renderFaults(el);
  if(currentTab==='stock') return renderStock(el);

  if(currentTab==='costs') return renderCosts(el);

// ================= PANEL =================
function renderPanel(el){
  const ws = startOfWeek(weekOffset);
  const we = new Date(ws); we.setDate(we.getDate()+6);
  const wsStr = ws.toISOString().slice(0,10), weStr = we.toISOString().slice(0,10);
  const withDue = db.assets.map(a=>({a, due: nextDueDate(a)})).filter(x=>x.due);
  const pending = withDue.filter(x=> daysDiff(x.due) <= 0).sort((p,q)=>p.due.localeCompare(q.due));
  const thisWeek = withDue.filter(x=> x.due>=wsStr && x.due<=weStr).sort((p,q)=>p.due.localeCompare(q.due));
  const openFaults = db.faults.filter(f=>f.status!=='Tamamlandı');
  const lowStock = db.materials.filter(m=>m.qty<=m.minQty);
  const inspGroups = computeGroupInspectionSummary(30);
  const extMaintGroups = computeGroupExtMaintSummary(30);

  el.innerHTML = `
    <div class="topbar"><div><h1>Panel</h1><div class="sub">Genel durum ve haftalık bakım listesi</div></div></div>
    <div class="kpis">
      <div class="kpi k-accent"><div class="n">${thisWeek.length}</div><div class="l">Bu hafta planlanan bakım</div></div>
      <div class="kpi k-danger"><div class="n">${pending.length}</div><div class="l">Bekleyen / geciken bakım</div></div>
      <div class="kpi k-warn"><div class="n">${openFaults.length}</div><div class="l">Açık arıza</div></div>
      <div class="kpi ${lowStock.length?'k-danger':'k-ok'}"><div class="n">${lowStock.length}</div><div class="l">Kritik stok kalemi</div></div>
    </div>

    ${pending.length?`<div class="panel">
      <h2 style="color:var(--danger);">Bekleyen Bakımlar (Geciken ve Bugün Vadesi Gelen)</h2>
      ${maintTableRows(pending)}
    </div>`:''}

    ${extMaintGroups.length?`<div class="panel">
      <h2 style="color:var(--warn);">Yaklaşan Dış Bakımlar (30 gün içinde)</h2>
      ${extMaintGroupRows(extMaintGroups)}
    </div>`:''}

    ${inspGroups.length?`<div class="panel">
      <h2 style="color:var(--warn);">Yaklaşan Muayeneler (30 gün içinde)</h2>
      ${inspectionGroupRows(inspGroups)}
    </div>`:''}

    <div class="panel">
      <div class="weeknav">
        <button class="ghost small" onclick="weekOffset--; renderTab();">‹ Önceki hafta</button>
        <span class="lbl">${fmt(ws)} — ${fmt(we)}${weekOffset===0?' (bu hafta)':''}</span>
        <button class="ghost small" onclick="weekOffset++; renderTab();">Sonraki hafta ›</button>
        ${weekOffset!==0?`<button class="ghost small" onclick="weekOffset=0; renderTab();">Bugüne dön</button>`:''}
      </div>
      <h2>Haftalık Bakım Listesi</h2>
      ${thisWeek.length? maintTableRows(thisWeek) : `<div class="empty">Bu hafta planlanmış bakım yok.</div>`}
    </div>

    ${lowStock.length?`<div class="panel">
      <h2 style="color:var(--danger);">Kritik Seviyedeki Malzemeler</h2>
      <table><thead><tr><th>Malzeme</th><th>Mevcut</th><th>Min. Seviye</th></tr></thead><tbody>
      ${lowStock.map(m=>`<tr><td>${esc(m.name)}</td><td class="lowstock">${m.qty} ${esc(m.unit)}</td><td class="mono">${m.minQty} ${esc(m.unit)}</td></tr>`).join('')}
      </tbody></table>
    </div>`:''}
  `;
}
function maintTableRows(list){
  return `<table><thead><tr><th>Varlık</th><th>Grup</th><th>Konum</th><th>Planlanan Tarih</th><th></th></tr></thead><tbody>
  ${list.map(x=>{
    const g = group(x.a.groupId);
    const dd = daysDiff(x.due);
    const cls = dd<0?'b-danger':(dd<=2?'b-warn':'b-accent');
    return `<tr>
      <td style="font-weight:700;">${esc(x.a.name)}</td>
      <td class="muted">${esc(g?g.name:'—')}</td>
      <td class="muted">${esc(x.a.location)}</td>
      <td class="mono"><span class="badge ${cls}"><span class="dot"></span>${fmtStr(x.due)}${dd<0?' (gecikti)':''}</span></td>
      <td>${can('doMaintenance')?`<button class="ghost small" onclick="openMaintForm({assetId:'${x.a.id}'})">Bakımı Tamamla</button>`:''}</td>
    </tr>`;
  }).join('')}
  </tbody></table>`;
}

window.renderAssetsTable = function(){
  const wrap = document.getElementById('assetsTableWrap');
  if(!wrap) return;
  const editable = can('editAssets');
  const q = assetQuery.trim().toLowerCase();
  const tree = orderedAssetsTree().filter(({a})=>{
    if(q){
      const hay = [a.name,a.assetCode,a.serial,a.brand,a.model,a.location].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(assetFGroup && a.groupId!==assetFGroup) return false;
    if(assetFStatus && a.status!==assetFStatus) return false;
    return true;
  });
  wrap.innerHTML = `<table><thead><tr>
      <th>Varlık</th><th>Marka / Model</th><th>Grup</th><th>Konum</th><th>Durum</th><th>Sıradaki Bakım</th><th></th>
    </tr></thead><tbody>
    ${tree.map(({a,depth})=>{
      const g = group(a.groupId);
      const due = nextDueDate(a);
      const dd = due?daysDiff(due):null;
      const stCls = a.status==='Aktif'?'b-ok':(a.status==='Arızalı'?'b-danger':'b-muted');
      const indent = 10 + depth*20;
      return `<tr>
        <td style="padding-left:${indent}px;">
          <div style="font-weight:700;">${depth>0?'↳ ':''}${esc(a.name)}</div>
          <div class="mono tiny muted">${esc(a.assetCode||'')}${a.serial?' · '+esc(a.serial):''}</div>
        </td>
        <td class="muted tiny">${esc(a.brand||'')}${a.model?' '+esc(a.model):''}${a.capacity?`<div class="mono tiny">${esc(a.capacity)}</div>`:''}</td>
        <td class="muted">${esc(g?g.name:'—')}</td>
        <td class="muted">${esc(a.location)}</td>
        <td><span class="badge ${stCls}"><span class="dot"></span>${esc(a.status)}</span></td>
        <td class="mono">${due?fmtStr(due)+(dd<0?' (gecikti)':''):'—'}</td>
        <td style="white-space:nowrap;">
          <button class="icon" title="Geçmiş" onclick="openAssetHistory('${a.id}')">🕘</button>
          <button class="icon" title="Ekler" onclick="openAttachments('${a.id}')">📎</button>
          <button class="icon" title="Yedek Parçalar" onclick="openSpareParts('${a.id}')">🔧</button>
          ${editable?`<button class="icon" title="Düzenle" onclick="openAssetForm('${a.id}')">✎</button><button class="icon" title="Sil" onclick="deleteAsset('${a.id}')">×</button>`:''}
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="7"><div class="empty">Eşleşen varlık yok.</div></td></tr>`}
    </tbody></table>`;
};
window.deleteAsset = function(id){
  confirmDelete('Bu varlığı silmek istediğinize emin misiniz? Ekler ve yedek parça tanımları da silinecek.', async ()=>{
    db.assets = db.assets.filter(a=>a.id!==id);
    db.assets.forEach(a=>{ if(a.parentId===id) a.parentId=null; });
    await saveDB(); renderTab();
  });
};
window.exportAssets = function(){

  if(assetCode){
    const dup = db.assets.find(x=> x.id!==id && (x.assetCode||'').trim().toLowerCase()===assetCode.toLowerCase());

    location: document.getElementById('m-loc').value.trim(), status: document.getElementById('m-status').value,

};

window.openAttachments = function(assetId){ openModal(renderAttachmentsHtml(assetId)); };
window.uploadAttachment = function(assetId, inputEl, kind){
  const file = inputEl.files[0];
  if(!file) return;
  if(file.size > 3.5*1024*1024){ alert("Dosya çok büyük (3.5 MB üzeri). Lütfen daha küçük bir dosya seçin veya bağlantı ekleyin."); inputEl.value=''; return; }
  const reader = new FileReader();
  reader.onload = async function(){
    const dataUrl = reader.result;
    const att = {id:uid('att'), name:file.name, kind, addedDate:todayStr()};
    const key = `cmms-file-${assetId}-${att.id}`;
    try{
      await window.storage.set(key, dataUrl, true);
      att.storageKey = key;
      const a = asset(assetId); a.attachments = a.attachments || []; a.attachments.push(att);
      await saveDB();
      document.getElementById('modalBody').innerHTML = renderAttachmentsHtml(assetId);
      renderTab();
    }catch(e){ alert('Dosya kaydedilemedi.'); }
  };
  reader.readAsDataURL(file);
};
window.addLinkAttachment = async function(assetId){
  const name = document.getElementById('att-link-name').value.trim();
  const url = document.getElementById('att-link-url').value.trim();
  if(!name || !url) return;
  const a = asset(assetId); a.attachments = a.attachments || [];
  a.attachments.push({id:uid('att'), name, kind:'link', url, addedDate:todayStr()});
  await saveDB();
  document.getElementById('modalBody').innerHTML = renderAttachmentsHtml(assetId);
  renderTab();
};
window.viewAttachment = async function(assetId, attId){
  const a = asset(assetId);
  const att = (a.attachments||[]).find(x=>x.id===attId);
  if(!att) return;
  if(att.kind==='link'){ window.open(window.safeUrl ? window.safeUrl(att.url) : att.url, '_blank', 'noopener,noreferrer'); return; }
  try{
    const res = await window.storage.get(att.storageKey, true);
    if(!res){ alert('Dosya bulunamadı.'); return; }
    const link = document.createElement('a'); link.href = res.value; link.download = att.name; link.target='_blank'; link.rel = 'noopener noreferrer';
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
  }catch(e){ alert('Dosya yüklenemedi.'); }
};
window.deleteAttachment = function(assetId, attId){
  confirmDelete('Bu eki silmek istediğinize emin misiniz?', async ()=>{
    const a = asset(assetId);
    const att = (a.attachments||[]).find(x=>x.id===attId);
    a.attachments = (a.attachments||[]).filter(x=>x.id!==attId);
    await saveDB();
    if(att && att.storageKey){ try{ await window.storage.delete(att.storageKey, true); }catch(e){} }
    document.getElementById('modalBody').innerHTML = renderAttachmentsHtml(assetId);
    renderTab();
  });
};

window.saveMaintForm = async function(recordId){
  const assetId = document.getElementById('m-maintasset').value;
  const a = asset(assetId);
  const type = document.getElementById('m-mainttype').value;
  const startDate = document.getElementById('m-startdate').value || todayStr();
  const endDate = document.getElementById('m-enddate').value || todayStr();
  const notes = document.getElementById('m-maintnote').value.trim();
  const extraCost = parseFloat(document.getElementById('m-maintextracost').value)||0;
  const checklistResults = tempChecklistResults.map(q=>({questionId:q.questionId, text:q.text, result:q.result}));
  const usedMaterials = tempUsedMaterials.filter(m=>m.qty>0).map(u=>{ const m=material(u.materialId); return {...u, unitCost: m?(m.unitCost||0):0}; });
  let newRecId = null;
  if(recordId){
    const rec = db.maintenanceRecords.find(r=>r.id===recordId);
    applyMaterialDelta(tempOriginalUsed, usedMaterials);
    logMaterialUsageDelta(tempOriginalUsed, usedMaterials, 'Bakım düzenleme: '+(rec.trackingNo||''), recordId);
    Object.assign(rec, {type, startDate, endDate, checklistResults, usedMaterials, notes, extraCost});
  } else {
    const rec = {id:uid('mr'), trackingNo:nextTrackingNo('maint'), assetId, dueDate:nextDueDate(a), type, startDate, endDate, completedBy:currentUser.id, checklistResults, usedMaterials, notes, extraCost};
    db.maintenanceRecords.push(rec);
    usedMaterials.forEach(u=>{ const m=material(u.materialId); if(m) m.qty = Math.max(0, +(m.qty-u.qty).toFixed(2)); });
    logMaterialUsageDelta([], usedMaterials, 'Bakım kullanımı: '+rec.trackingNo, rec.id);
    newRecId = rec.id;
  }
  recalcAssetLastMaintenance(assetId);
  await saveDB(); closeModal(); renderTab();
  if(newRecId){
    const rec = db.maintenanceRecords.find(r=>r.id===newRecId);
    openModal(`<h3>Bakım Tamamlandı</h3><p style="font-size:13px; color:var(--ink-soft);">${esc(rec.trackingNo)} numaralı bakım kaydı oluşturuldu. Formu şimdi yazdırmak ister misiniz?</p>
      <div class="actions"><button class="ghost" onclick="closeModal()">Kapat</button><button class="primary" onclick="printMaintRecord('${newRecId}')">🖨️ Şimdi Yazdır</button></div>`);
  }
};

window.updateInspectionGroupAssets = function(groupId){
  const groupAssets = db.assets.filter(a=>a.groupId===groupId);
  const dueAssets = groupAssets.filter(a=>{ const due=nextInspectionDue(a); return due && daysDiff(due)<=14; });
  tempInspectionAssetIds = (dueAssets.length?dueAssets:groupAssets).map(a=>a.id);
  renderInspectionAssetChecklist(groupId);
};
function renderInspectionAssetChecklist(groupId){
  const w = document.getElementById('inspAssetChecklist');
  if(!w) return;
  const groupAssets = db.assets.filter(a=>a.groupId===groupId);
  if(!groupAssets.length){ w.innerHTML = '<div class="muted tiny">Bu grupta varlık yok.</div>'; return; }
  const rows = groupAssets.map(function(a){
    const due = nextInspectionDue(a);
    const dd = due ? daysDiff(due) : null;
    let extra = a.location ? ('· '+esc(a.location)) : '';
    if(due) extra += ' · '+fmtStr(due)+(dd<0?' (gecikti)':'');
    return '<label style="display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px;">'
      + '<input type="checkbox" '+(tempInspectionAssetIds.includes(a.id)?'checked':'')+' onchange="toggleInspectionAsset(\''+a.id+'\', this.checked)">'
      + esc(a.name) + ' <span class="muted tiny">'+extra+'</span></label>';
  }).join('');
  const allChecked = groupAssets.every(a=>tempInspectionAssetIds.includes(a.id));
  w.innerHTML = '<label style="display:block; margin-bottom:6px; font-size:12px; font-weight:700; color:var(--accent); cursor:pointer;">'
    + '<input type="checkbox" '+(allChecked?'checked':'')+' onchange="toggleAllInspectionAssets(\''+groupId+'\', this.checked)"> Tümünü Seç / Kaldır</label>'
    + rows;
}
window.toggleInspectionAsset = function(assetId, checked){
  if(checked){ if(!tempInspectionAssetIds.includes(assetId)) tempInspectionAssetIds.push(assetId); }
  else { tempInspectionAssetIds = tempInspectionAssetIds.filter(id=>id!==assetId); }
};
window.toggleAllInspectionAssets = function(groupId, checked){
  const groupAssets = db.assets.filter(a=>a.groupId===groupId);
  if(checked){ groupAssets.forEach(a=>{ if(!tempInspectionAssetIds.includes(a.id)) tempInspectionAssetIds.push(a.id); }); }
  else { const ids = groupAssets.map(a=>a.id); tempInspectionAssetIds = tempInspectionAssetIds.filter(id=>!ids.includes(id)); }
  renderInspectionAssetChecklist(groupId);
};

window.addCertFile = function(inputEl, kind){
  const file = inputEl.files[0];
  if(!file) return;
  if(file.size > 3.5*1024*1024){ alert('Dosya çok büyük (3.5 MB üzeri). Daha büyük dosyalar için "Bağlantı Ekle" seçeneğini kullanın.'); inputEl.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(){
    tempCertificates.push({id:uid('cert'), name:file.name, kind, dataUrl:reader.result, addedDate:todayStr()});
    renderCertRows();
    inputEl.value='';
  };
  reader.readAsDataURL(file);
};

window.viewCertificate = async function(storageKey){

  }catch(e){ alert('Dosya yüklenemedi.'); }

window.saveInspectionForm = async function(recordId){
  const groupId = document.getElementById('m-inspgroup').value;
  const assetIds = [...tempInspectionAssetIds];
  if(!assetIds.length){ alert('En az bir varlık seçmelisiniz.'); return; }
  const contractor = document.getElementById('m-inspcontractor').value.trim();
  const startDate = document.getElementById('m-inspstart').value || todayStr();
  const endDate = document.getElementById('m-inspend').value || todayStr();
  const notes = document.getElementById('m-inspnote').value.trim();
  const serviceCost = parseFloat(document.getElementById('m-inspcost').value)||0;

  const targetId = recordId || uid('ir');
  for(const key of certsToDelete){ try{ await window.storage.delete(key, true); }catch(e){} }
  const savedCerts = [];
  for(const c of tempCertificates){
    if(c.kind==='link'){ savedCerts.push({id:c.id, name:c.name, kind:'link', url:c.url, addedDate:c.addedDate}); continue; }
    if(c.storageKey){ savedCerts.push({id:c.id, name:c.name, kind:c.kind, storageKey:c.storageKey, addedDate:c.addedDate}); continue; }
    const key = `cmms-cert-${targetId}-${c.id}`;
    try{
      await window.storage.set(key, c.dataUrl, true);
      savedCerts.push({id:c.id, name:c.name, kind:c.kind, storageKey:key, addedDate:c.addedDate});
    }catch(e){ alert('"'+c.name+'" kaydedilemedi, atlandı.'); }
  }

  let newRecId = null;
  if(recordId){
    const rec = db.inspectionRecords.find(r=>r.id===recordId);
    Object.assign(rec, {groupId, assetIds, contractor, startDate, endDate, notes, serviceCost, certificates:savedCerts});
  } else {
    const rec = {id:targetId, trackingNo:nextTrackingNo('inspection'), groupId, assetIds, contractor, startDate, endDate, notes, serviceCost, certificates:savedCerts, completedBy:currentUser.id};
    db.inspectionRecords.push(rec);
    newRecId = rec.id;
  }
  assetIds.forEach(id=>recalcAssetLastInspection(id));

};

      <td style="font-weight:700;">${esc(x.group.name)}</td>
      <td class="muted">${x.dueSoon.length} / ${x.assets.length} varlık</td>

window.updateExtMaintGroupAssets = function(groupId){
  const groupAssets = db.assets.filter(a=>a.groupId===groupId);
  const dueAssets = groupAssets.filter(a=>{ const due=nextExtMaintDue(a); return due && daysDiff(due)<=14; });
  tempExtMaintAssetIds = (dueAssets.length?dueAssets:groupAssets).map(a=>a.id);
  renderExtMaintAssetChecklist(groupId);
};
function renderExtMaintAssetChecklist(groupId){
  const w = document.getElementById('extMaintAssetChecklist');
  if(!w) return;
  const groupAssets = db.assets.filter(a=>a.groupId===groupId);
  if(!groupAssets.length){ w.innerHTML = '<div class="muted tiny">Bu grupta varlık yok.</div>'; return; }
  const rows = groupAssets.map(function(a){
    const due = nextExtMaintDue(a);
    const dd = due ? daysDiff(due) : null;
    let extra = a.location ? ('· '+esc(a.location)) : '';
    if(due) extra += ' · '+fmtStr(due)+(dd<0?' (gecikti)':'');
    return '<label style="display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px;">'
      + '<input type="checkbox" '+(tempExtMaintAssetIds.includes(a.id)?'checked':'')+' onchange="toggleExtMaintAsset(\''+a.id+'\', this.checked)">'
      + esc(a.name) + ' <span class="muted tiny">'+extra+'</span></label>';
  }).join('');
  const allChecked = groupAssets.every(a=>tempExtMaintAssetIds.includes(a.id));
  w.innerHTML = '<label style="display:block; margin-bottom:6px; font-size:12px; font-weight:700; color:var(--accent); cursor:pointer;">'
    + '<input type="checkbox" '+(allChecked?'checked':'')+' onchange="toggleAllExtMaintAssets(\''+groupId+'\', this.checked)"> Tümünü Seç / Kaldır</label>'
    + rows;
}
window.toggleExtMaintAsset = function(assetId, checked){
  if(checked){ if(!tempExtMaintAssetIds.includes(assetId)) tempExtMaintAssetIds.push(assetId); }
  else { tempExtMaintAssetIds = tempExtMaintAssetIds.filter(id=>id!==assetId); }
};
window.toggleAllExtMaintAssets = function(groupId, checked){
  const groupAssets = db.assets.filter(a=>a.groupId===groupId);
  if(checked){ groupAssets.forEach(a=>{ if(!tempExtMaintAssetIds.includes(a.id)) tempExtMaintAssetIds.push(a.id); }); }
  else { const ids = groupAssets.map(a=>a.id); tempExtMaintAssetIds = tempExtMaintAssetIds.filter(id=>!ids.includes(id)); }
  renderExtMaintAssetChecklist(groupId);
};
window.saveExtMaintForm = async function(recordId){
  const groupId = document.getElementById('m-extgroup').value;
  const assetIds = [...tempExtMaintAssetIds];
  if(!assetIds.length){ alert('En az bir varlık seçmelisiniz.'); return; }
  const contractor = document.getElementById('m-extcontractor').value.trim();
  const startDate = document.getElementById('m-extstart').value || todayStr();
  const endDate = document.getElementById('m-extend').value || todayStr();
  const notes = document.getElementById('m-extnote').value.trim();
  const serviceCost = parseFloat(document.getElementById('m-extcost').value)||0;

  const targetId = recordId || uid('em');
  for(const key of certsToDelete){ try{ await window.storage.delete(key, true); }catch(e){} }
  const savedCerts = [];
  for(const c of tempCertificates){
    if(c.kind==='link'){ savedCerts.push({id:c.id, name:c.name, kind:'link', url:c.url, addedDate:c.addedDate}); continue; }
    if(c.storageKey){ savedCerts.push({id:c.id, name:c.name, kind:c.kind, storageKey:c.storageKey, addedDate:c.addedDate}); continue; }
    const key = `cmms-extcert-${targetId}-${c.id}`;
    try{
      await window.storage.set(key, c.dataUrl, true);
      savedCerts.push({id:c.id, name:c.name, kind:c.kind, storageKey:key, addedDate:c.addedDate});
    }catch(e){ alert('"'+c.name+'" kaydedilemedi, atlandı.'); }
  }

  let newRecId = null;
  if(recordId){
    const rec = db.extMaintRecords.find(r=>r.id===recordId);
    Object.assign(rec, {groupId, assetIds, contractor, startDate, endDate, notes, serviceCost, certificates:savedCerts});
  } else {
    const rec = {id:targetId, trackingNo:nextTrackingNo('extmaint'), groupId, assetIds, contractor, startDate, endDate, notes, serviceCost, certificates:savedCerts, completedBy:currentUser.id};
    db.extMaintRecords.push(rec);
    newRecId = rec.id;
  }
  assetIds.forEach(id=>recalcAssetLastExtMaint(id));
  await saveDB(); closeModal(); renderTab();
  if(newRecId){
    const rec = db.extMaintRecords.find(r=>r.id===newRecId);
    openModal(`<h3>Dış Bakım Kaydedildi</h3><p style="font-size:13px; color:var(--ink-soft);">${esc(rec.trackingNo)} numaralı dış bakım kaydı ${assetIds.length} varlık için oluşturuldu.</p>
      <div class="actions"><button class="primary" onclick="closeModal()">Kapat</button></div>`);
  }
};

window.renderFaultsTable = function(){
  const body = document.getElementById('faultBody');

    if(q){
      const a = asset(f.assetId);

window.saveFault = async function(){
  const title = document.getElementById('m-ftitle').value.trim();
  const assetId = document.getElementById('m-fasset').value;
  if(!title || !assetId) return;
  const faultId = uid('f');

      await window.storage.set(key, c.dataUrl, true);
      savedAtts.push({id:c.id, name:c.name, kind:c.kind, storageKey:key, addedDate:c.addedDate});
    }catch(e){ alert('"'+c.name+'" kaydedilemedi, atlandı.'); }
  }
  const f = {id:faultId, trackingNo:nextTrackingNo('fault'), assetId, title, description:document.getElementById('m-fdesc').value.trim(),
    reportedBy:currentUser.id, reportedDate:todayStr(), priority:document.getElementById('m-fprio').value,

window.saveFaultDetail = async function(id){
  const f = db.faults.find(x=>x.id===id);
  const newStatus = document.getElementById('m-fstatus').value;
  const usedMaterials = tempUsedMaterials.filter(m=>m.qty>0).map(u=>{ const m=material(u.materialId); return {...u, unitCost: m?(m.unitCost||0):0}; });
  applyMaterialDelta(tempOriginalUsed, usedMaterials);
  logMaterialUsageDelta(tempOriginalUsed, usedMaterials, 'Arıza: '+(f.trackingNo||''), id);
  for(const key of certsToDelete){ try{ await window.storage.delete(key, true); }catch(e){} }
  const savedAtts = [];
  for(const c of tempCertificates){
    if(c.kind==='link'){ savedAtts.push({id:c.id, name:c.name, kind:'link', url:c.url, addedDate:c.addedDate}); continue; }
    if(c.storageKey){ savedAtts.push({id:c.id, name:c.name, kind:c.kind, storageKey:c.storageKey, addedDate:c.addedDate}); continue; }
    const key = `cmms-faultimg-${id}-${c.id}`;
    try{
      await window.storage.set(key, c.dataUrl, true);
      savedAtts.push({id:c.id, name:c.name, kind:c.kind, storageKey:key, addedDate:c.addedDate});
    }catch(e){ alert('"'+c.name+'" kaydedilemedi, atlandı.'); }
  }
  f.attachments = savedAtts;
  f.title = document.getElementById('m-ftitle').value.trim() || f.title;
  f.description = document.getElementById('m-fdesc').value.trim();
  f.priority = document.getElementById('m-fprio').value;
  f.assignedTo = document.getElementById('m-fassign').value || null;
  f.usedMaterials = usedMaterials;
  f.externalServiceCost = parseFloat(document.getElementById('m-fextcost').value)||0;
  f.notes = document.getElementById('m-fnote').value.trim();
  const resolvedInput = document.getElementById('m-fresolved').value || null;
  const wasOpen = f.status!=='Tamamlandı';
  f.status = newStatus;
  f.resolvedDate = newStatus==='Tamamlandı' ? (resolvedInput || todayStr()) : null;
  const a = asset(f.assetId);
  if(a){
    if(newStatus==='Tamamlandı'){ if(!db.faults.some(x=>x.assetId===a.id && x.status!=='Tamamlandı' && x.id!==f.id)) a.status='Aktif'; }
    else { a.status='Arızalı'; }
  }
  await saveDB(); closeModal(); renderTab();
  if(newStatus==='Tamamlandı' && wasOpen){
    openModal(`<h3>Arıza Kapatıldı</h3><p style="font-size:13px; color:var(--ink-soft);">${esc(f.trackingNo)} numaralı arıza tamamlandı olarak işaretlendi. Formu şimdi yazdırmak ister misiniz?</p>
      <div class="actions"><button class="ghost" onclick="closeModal()">Kapat</button><button class="primary" onclick="printFaultRecord('${id}')">🖨️ Şimdi Yazdır</button></div>`);
  }
};

function getAutoLowStockNeeds(){
  return db.materials.filter(m=>{

    const hasActive = db.needsList.some(n=> n.materialId===m.id && n.status!=='Alındı');
    return !hasActive;
  }).map(m=>({
    auto:true, materialId:m.id, name:m.name, qty: Math.max(1, +(m.minQty-m.qty).toFixed(2)),
    estimatedPrice:0, supplierId:m.defaultSupplierId||null,

}

      comboPick('m-psupplierid', mat.defaultSupplierId);
    }

  const initSupplierId = editingP ? (editingP.supplierId||'') : ((prefill && prefill.supplierId) || (initMat && initMat.defaultSupplierId) || '');
  comboInit('m-psupplierid', [{value:'',label:'— Yok / kayıtlı değil —'}].concat(db.suppliers.map(s=>({value:s.id,label:s.name,sub:s.paymentTerms}))), initSupplierId, function(val){
    const s = supplier(val); if(s) document.getElementById('m-psupplier').value = s.name;
  });

window.savePurchase = async function(needId, editId){
  const materialId = document.getElementById('m-pmat').value;
  const qty = parseFloat(document.getElementById('m-pqty').value)||0;
  const unitPrice = parseFloat(document.getElementById('m-pprice').value)||0;
  if(qty<=0) return;
  const supplierId = document.getElementById('m-psupplierid').value || null;
  const supplierText = document.getElementById('m-psupplier').value.trim();
  const projectId = document.getElementById('m-pproject').value || null;
  const note = document.getElementById('m-pnote').value.trim();
  if(editId){
    const p = db.purchases.find(x=>x.id===editId);
    const oldMat = material(p.materialId);
    if(oldMat) oldMat.qty = Math.max(0, +(oldMat.qty - p.qty).toFixed(2));
    p.materialId = materialId; p.qty = qty; p.unitPrice = unitPrice; p.totalPrice = +(qty*unitPrice).toFixed(2);
    p.supplierId = supplierId; p.supplier = supplierText; p.projectId = projectId; p.note = note;
    const newMat = material(materialId);
    if(newMat){ newMat.qty = +(newMat.qty + qty).toFixed(2); if(unitPrice>0) newMat.unitCost = unitPrice; }
    const mv = db.stockMovements.find(x=>x.refPurchaseId===editId);
    if(mv){ mv.materialId = materialId; mv.qty = qty; mv.reason = 'Satın alma (düzenlendi): '+(supplierText||(supplierId&&supplier(supplierId)?supplier(supplierId).name:'—')); }
  } else {
    const p = {id:uid('p'), materialId, qty, unitPrice, totalPrice:+(qty*unitPrice).toFixed(2), supplierId, supplier:supplierText, projectId, date:todayStr(), buyerId:currentUser.id, note};
    db.purchases.push(p);
    addStockMovement(materialId, 'Giriş', qty, 'Satın alma: '+(supplierText||(supplierId&&supplier(supplierId)?supplier(supplierId).name:'—')), p.id);
    const mat = material(materialId); if(mat && unitPrice>0) mat.unitCost = unitPrice;
    if(needId){ const need = db.needsList.find(n=>n.id===needId); if(need) need.status='Alındı'; }
  }
  await saveDB(); closeModal(); renderTab();
};

function projectPurchasesCost(projectId){
  return db.purchases.filter(p=>p.projectId===projectId).reduce((s,p)=>s+(p.totalPrice||0),0);

function projectTasksCost(project){
  return (project.tasks||[]).reduce((s,t)=>s+(t.cost||0),0);
}
function projectTotalCost(project){
  return projectPurchasesCost(project.id) + projectTasksCost(project);
}

window.saveQuoteForm = async function(projectId, quoteId){
  const p = db.projects.find(x=>x.id===projectId);
  const amount = parseFloat(document.getElementById('m-quoteamount').value)||0;
  const supplierId = document.getElementById('m-quotesupplierid').value || null;
  const supplierName = document.getElementById('m-quotesupname').value.trim();
  const date = document.getElementById('m-quotedate').value || todayStr();
  const validUntil = document.getElementById('m-quotevalid').value || null;
  const status = document.getElementById('m-quotestatus').value;
  const note = document.getElementById('m-quotenote').value.trim();
  const fileInput = document.getElementById('m-quotefile');
  const file = fileInput.files[0];

  let existing = quoteId ? p.quotes.find(x=>x.id===quoteId) : null;
  const qid = existing ? existing.id : uid('quote');
  const data = {id:qid, supplierId, supplierName, amount, date, validUntil, status, note,
    fileStorageKey: existing?existing.fileStorageKey:null, fileUrl: existing?existing.fileUrl:null, fileName: existing?existing.fileName:null};

  if(file){
    if(file.size > 3.5*1024*1024){ alert("Dosya çok büyük (3.5 MB üzeri)."); return; }
    const reader = new FileReader();
    await new Promise((resolve)=>{
      reader.onload = async function(){
        const key = `cmms-quote-${p.id}-${qid}`;
        try{ await window.storage.set(key, reader.result, true); data.fileStorageKey = key; data.fileName = file.name; data.fileUrl=null; }catch(e){}
        resolve();
      };
      reader.readAsDataURL(file);
    });
  }

  if(existing){ Object.assign(existing, data); }
  else { p.quotes = p.quotes||[]; p.quotes.push(data); }
  await saveDB(); closeModal(); renderTab();
};
window.deleteQuote = function(projectId, quoteId){
  confirmDelete('Bu teklifi silmek istediğinize emin misiniz?', async ()=>{
    const p = db.projects.find(x=>x.id===projectId);
    const q = p.quotes.find(x=>x.id===quoteId);
    p.quotes = p.quotes.filter(x=>x.id!==quoteId);
    if(q && q.fileStorageKey){ try{ await window.storage.delete(q.fileStorageKey, true); }catch(e){} }
    await saveDB(); renderTab();
  });
};

function collectCostRecords(startDate, endDate){
  const recs = [];
  db.maintenanceRecords.forEach(r=>{
    if(startDate && r.endDate<startDate) return;
    if(endDate && r.endDate>endDate) return;
    recs.push({type:'Bakım', date:r.endDate, assetId:r.assetId, cost:maintRecordCost(r), trackingNo:r.trackingNo});
  });
  db.faults.filter(f=>f.status==='Tamamlandı' && f.resolvedDate).forEach(f=>{
    if(startDate && f.resolvedDate<startDate) return;
    if(endDate && f.resolvedDate>endDate) return;
    recs.push({type:'Arıza', date:f.resolvedDate, assetId:f.assetId, cost:faultCost(f), trackingNo:f.trackingNo});
  });
  db.inspectionRecords.forEach(r=>{
    if(startDate && r.endDate<startDate) return;
    if(endDate && r.endDate>endDate) return;
    const ids = r.assetIds||[];
    const per = ids.length ? (r.serviceCost||0)/ids.length : 0;
    ids.forEach(assetId=>{ recs.push({type:'Muayene', date:r.endDate, assetId, cost:per, trackingNo:r.trackingNo}); });
  });
  db.extMaintRecords.forEach(r=>{
    if(startDate && r.endDate<startDate) return;
    if(endDate && r.endDate>endDate) return;
    const ids = r.assetIds||[];
    const per = ids.length ? (r.serviceCost||0)/ids.length : 0;
    ids.forEach(assetId=>{ recs.push({type:'Dış Bakım', date:r.endDate, assetId, cost:per, trackingNo:r.trackingNo}); });
  });
  return recs;
}

window.exportCostReport = function(){
  let recs = collectCostRecords(costStartDate||null, costEndDate||null);
  if(costFType) recs = recs.filter(r=>r.type===costFType);
  recs.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const headers=['Tarih','Tip','Varlık','Takip No','Tutar'];
  const rows = recs.map(r=>{ const a=asset(r.assetId); return [fmtStr(r.date), r.type, a?a.name:'', r.trackingNo||'', r.cost.toFixed(2)]; });
  exportCSV('maliyet-raporu.csv', headers, rows);
};

window.importAssetsFile = function(inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(){
    const rows = parseCSV(String(reader.result));
    if(rows.length<2){ alert('Dosyada veri satırı bulunamadı.'); inputEl.value=''; return; }
    const dataRows = rows.slice(1);
    let added=0, updated=0; const errors=[];
    const pendingParents = [];
    dataRows.forEach((r,idx)=>{
      const cols = r.map(c=>(c||'').trim());
      const [name, assetCode, serial, brand, model, capacity, groupName, parentCode, location, status, lastMaint, description] = cols;
      if(!name){ errors.push(`Satır ${idx+2}: varlık adı boş, atlandı.`); return; }
      let g = groupName ? db.assetGroups.find(x=>x.name.toLowerCase()===groupName.toLowerCase()) : null;
      if(groupName && !g){ errors.push(`Satır ${idx+2}: "${groupName}" grubu bulunamadı.`); }
      const statusVal = ['Aktif','Arızalı','Pasif'].includes(status) ? status : 'Aktif';
      const lastMaintVal = /^\d{4}-\d{2}-\d{2}$/.test(lastMaint||'') ? lastMaint : null;
      let existing = assetCode ? db.assets.find(x=>(x.assetCode||'').toLowerCase()===assetCode.toLowerCase()) : null;
      const data = {name, assetCode, serial, brand, model, capacity, description,
        groupId: g?g.id:(existing?existing.groupId:(db.assetGroups[0]&&db.assetGroups[0].id)),
        location, status:statusVal, lastMaintenanceDate:lastMaintVal};
      if(existing){ Object.assign(existing, data); updated++; if(parentCode) pendingParents.push({asset:existing, parentCode}); }
      else{ const a = {id:uid('a'), createdDate:todayStr(), spareParts:[], attachments:[], parentId:null, ...data}; db.assets.push(a); added++; if(parentCode) pendingParents.push({asset:a, parentCode}); }
    });
    pendingParents.forEach(({asset,parentCode})=>{
      const p = db.assets.find(x=>(x.assetCode||'').toLowerCase()===parentCode.toLowerCase() && x.id!==asset.id);
      if(p) asset.parentId = p.id; else errors.push(`"${asset.name}" için üst varlık kodu "${parentCode}" bulunamadı.`);
    });
    await saveDB();
    inputEl.value='';
    renderTab();
    const el = document.getElementById('assetImportResult');
    if(el) el.innerHTML = `<div class="panel" style="margin-top:10px; background:#fafbfa;">
      <div style="font-weight:700; margin-bottom:6px;">${added} yeni varlık eklendi, ${updated} varlık güncellendi.</div>
      ${errors.length?`<div class="muted tiny">${errors.map(e=>esc(e)).join('<br>')}</div>`:''}
    </div>`;
  };
  reader.readAsText(file, 'UTF-8');
};
window.importMaterialsFile = function(inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(){
    const rows = parseCSV(String(reader.result));
    if(rows.length<2){ alert('Dosyada veri satırı bulunamadı.'); inputEl.value=''; return; }
    const dataRows = rows.slice(1);
    let added=0, updated=0; const errors=[];
    dataRows.forEach((r,idx)=>{
      const cols = r.map(c=>(c||'').trim());
      const [name, unit, qty, minQty] = cols;
      if(!name){ errors.push(`Satır ${idx+2}: malzeme adı boş, atlandı.`); return; }
      const qtyVal = parseFloat(qty)||0;
      const minVal = parseFloat(minQty)||0;
      let existing = db.materials.find(x=>x.name.toLowerCase()===name.toLowerCase());
      if(existing){ Object.assign(existing, {unit:unit||existing.unit, qty:qtyVal, minQty:minVal}); updated++; }
      else{ db.materials.push({id:uid('m'), name, unit:unit||'adet', qty:qtyVal, minQty:minVal}); added++; }
    });
    await saveDB();
    inputEl.value='';
    renderTab();
    const el = document.getElementById('materialImportResult');
    if(el) el.innerHTML = `<div class="panel" style="margin-top:10px; background:#fafbfa;">
      <div style="font-weight:700; margin-bottom:6px;">${added} yeni malzeme eklendi, ${updated} malzeme güncellendi.</div>
      ${errors.length?`<div class="muted tiny">${errors.map(e=>esc(e)).join('<br>')}</div>`:''}
    </div>`;
  };
  reader.readAsText(file, 'UTF-8');
};
